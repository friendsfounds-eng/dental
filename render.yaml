services:
  - type: web
    name: apex-dental-clinic-erp
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLINIC_VAULT_ENCRYPTION_KEY
        generateValue: true
    # Persistent disk for paid plans (Free tier keeps data in server/data ephemeral)
    disk:
      name: dental-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 10
