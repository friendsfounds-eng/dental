# ==============================================================================
# Nginx Reverse Proxy Configuration for Apex Dental Clinic ERP
# Place in /etc/nginx/sites-available/dental-erp and symlink to sites-enabled
# ==============================================================================

server {
    listen 80;
    server_name clinic.yourdomain.com; # Replace with your clinic domain or IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is installed)
    # return 301 https://$host$request_uri;

    # Maximum file upload size (matches 60MB limit for high-res radiograph & DICOM scans)
    client_max_body_size 60M;

    # Gzip Compression for fast delivery of clinic dashboard and charts
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache long-term Vite immutable assets
    location /assets/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main application proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # Connection and header forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running accounting exports & large DICOM uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_cache_bypass $http_upgrade;
    }
}
